<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Login</title>
    <link id="theme-style" rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<br><br><br>
<center>
<form action="home.html" method="get">
    <table border="1" width="600" cellpadding="16" cellspacing="0">
        <tr>
            <td align="center" bgcolor="#f0f0f0">
                <h1>LOGIN</h1>
            </td>
        </tr>
        <tr>
            <td align="center" class="content-container-td">
                <div class="form-box">
                    <table border="0" width="100%" class="form-table" cellpadding="10" cellspacing="8">
                        <tr>
                            <td align="right" width="35%"><b>EMAIL:</b></td>
                            <td align="left" width="65%">
                                <input type="email" name="email" size="35" required placeholder="Enter your email">
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><b>PASSWORD:</b></td>
                            <td align="left">
                                <input type="password" name="password" size="35" required placeholder="Enter your password">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <div class="form-submit-container">
                                    <input type="submit" value="  LOGIN  ">
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
        <tr>
            <td align="center">
                <div class="bottom-link-flex">
                    <a href="signup.html"><h3>DON'T HAVE AN ACCOUNT? SIGN UP</h3></a>
                </div>
            </td>
        </tr>
    </table>
</form>
</center>

<script src="script.js"></script>
</body>
</html>
