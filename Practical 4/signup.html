<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Sign Up</title>
    <link id="theme-style" rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<br><br>
<center>
<form action="login.html" method="get">
    <table border="1" width="650" cellpadding="16" cellspacing="0">
        <tr>
            <td align="center" bgcolor="#f0f0f0">
                <h1>SIGN UP</h1>
            </td>
        </tr>
        <tr>
            <td align="center" class="content-container-td">
                <div class="form-box">
                    <table border="0" width="100%" class="form-table" cellpadding="8" cellspacing="8">
                        <tr>
                            <td align="right" width="40%"><b>NAME:</b></td>
                            <td align="left" width="60%">
                                <input type="text" name="name" size="35" required placeholder="Enter full name">
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><b>ENROLLMENT NUMBER:</b></td>
                            <td align="left">
                                <input type="text" name="enrollment" size="35" required placeholder="Enter enrollment number">
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><b>EMAIL:</b></td>
                            <td align="left">
                                <input type="email" name="email" size="35" required placeholder="Enter student email">
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><b>PASSWORD:</b></td>
                            <td align="left">
                                <input type="password" name="password" size="35" required placeholder="Create password">
                            </td>
                        </tr>
                        <tr>
                            <td align="right"><b>CONFIRM PASSWORD:</b></td>
                            <td align="left">
                                <input type="password" name="confirm_password" size="35" required placeholder="Confirm password">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <div class="form-submit-container">
                                    <input type="submit" value="  CREATE ACCOUNT  ">
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
        <tr>
            <td align="center">
                <div class="bottom-link-flex">
                    <a href="login.html"><h3>ALREADY HAVE AN ACCOUNT? LOGIN</h3></a>
                </div>
            </td>
        </tr>
    </table>
</form>
</center>

<script src="script.js"></script>
</body>
</html>
