<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Timetable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="timetable-page">

<table border="1" width="100%" cellpadding="10" cellspacing="0">
    <tr>
        <td align="left" width="70%">
            <h1>STUDENTHUB PORTAL</h1>
        </td>
        <td align="right" width="30%">
            <div class="top-nav-flex">
                <a href="home.html" class="back-button"><b>BACK</b></a>
            </div>
        </td>
    </tr>
    <tr>
        <td colspan="2" align="center" bgcolor="#f0f0f0">
            <h2>TIME TABLE</h2>
        </td>
    </tr>
    <tr>
        <td colspan="2" class="timetable-container-td">
            <div class="timetable-box">
                <table border="0" width="100%" cellpadding="8" cellspacing="0" align="center">
                <tr bgcolor="#e0e0e0">
                    <th width="10%">TIME</th>
                    <th width="18%">MON</th>
                    <th width="18%">TUE</th>
                    <th width="18%">WED</th>
                    <th width="18%">THU</th>
                    <th width="18%">FRI</th>
                </tr>
                <tr>
                    <td align="center"><b>9:00</b></td>
                    <td align="center">DS</td>
                    <td align="center">MATHS</td>
                    <td align="center">OOP</td>
                    <td align="center">DLD</td>
                    <td align="center">COA</td>
                </tr>
                <tr>
                    <td align="center"><b>10:00</b></td>
                    <td align="center">DLD</td>
                    <td align="center">COA</td>
                    <td align="center">DS</td>
                    <td align="center">MATHS</td>
                    <td align="center">DS</td>
                </tr>
                <tr bgcolor="#f5f5f5">
                    <td align="center"><b>11:00</b></td>
                    <td colspan="5" align="center"><b>LUNCH BREAK</b></td>
                </tr>
                <tr>
                    <td align="center"><b>12:00</b></td>
                    <td align="center">COA</td>
                    <td align="center">DS LAB</td>
                    <td align="center">MATHS</td>
                    <td align="center">OOP LAB</td>
                    <td align="center">DLD LAB</td>
                </tr>
                <tr>
                    <td align="center"><b>1:00</b></td>
                    <td align="center">OOP LAB</td>
                    <td align="center">DS LAB</td>
                    <td align="center">COA LAB</td>
                    <td align="center">OOP LAB</td>
                    <td align="center">DLD LAB</td>
                </tr>
                <tr>
                    <td align="center"><b>2:00</b></td>
                    <td align="center">OOP LAB</td>
                    <td align="center">DLD</td>
                    <td align="center">COA LAB</td>
                    <td align="center">DS</td>
                    <td align="center">MATHS</td>
                </tr>
                <tr>
                    <td align="center"><b>3:00</b></td>
                    <td align="center">MATHS</td>
                    <td align="center">OOP</td>
                    <td align="center">DLD</td>
                    <td align="center">COA</td>
                    <td align="center">OOP</td>
                </tr>
            </table>
            </div>
        </td>
    </tr>
</table>

</body>
</html>
